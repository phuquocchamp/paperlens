# Alembic configuration for PaperLens.
#
# NOTE: sqlalchemy.url is intentionally left EMPTY. The DSN is read from
# app.config.settings.database_url inside alembic/env.py and passed directly to
# create_async_engine. Do not put it here — ConfigParser interpolates '%',
# which mangles DB passwords that contain it.

[alembic]
script_location = alembic
prepend_sys_path = .
# Version filenames: NNNN_slug.
version_num_format = %%04d
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
