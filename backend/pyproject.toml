[project]
name = "paperlens-backend"
version = "0.1.0"
description = "PaperLens backend — project-scoped, page-verifiable Q&A over scientific papers"
requires-python = ">=3.11"
dependencies = [
  # --- Web / API ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",     # file uploads
  "httpx>=0.27",                 # DeepSeek + generic async HTTP
  # --- Config / validation ---
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # --- Relational DB ---
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  # --- Queue / cache ---
  "arq>=0.26",
  "redis>=5.0",
  # --- Vector DB ---
  "qdrant-client>=1.12",
  # --- RAG / parsing / embeddings ---
  "docling>=2.0",                # TableFormer parsing (worker only, lazy-imported)
  "openai>=1.40",                # embeddings + OpenAI fallback LLM
  "fastembed>=0.3",              # BM25 sparse (client-side TF, server-side IDF)
  "rapidfuzz>=3.9",              # grounding fuzzy quote-match (badge only)
  "pymupdf>=1.24",               # fitz — fast page_count pre-check on upload
  # --- Observability ---
  "structlog>=24.1",
  "langfuse>=2.0",
  # --- Reliability ---
  "tenacity>=8.3",               # retry/backoff for embedding + LLM
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",          # module boundary enforcement (wired in iteration 2)
]

[project.scripts]
# Two entrypoints, one image (modular monolith): interactive vs. batch.
paperlens-api = "app.main:main"
paperlens-worker = "app.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
